[workspace]
resolver = "3"
members = ["crates/capture", "crates/soniox", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
capture = { path = "crates/capture" }
soniox = { path = "crates/soniox" }
anyhow = "1"
audioadapter-buffers = "5.2"
chrono = "0.4"
cpal = "0.18.2"
dirs = "7"
eframe = "0.36.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hound = "3.5"
keyring = { version = "4.2", default-features = false, features = ["v1"] }
objc2 = "0.6"
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "multipart", "json"] }
rtrb = "0.4"
rubato = "5"
security-framework = "3.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
